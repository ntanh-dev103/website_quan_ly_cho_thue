server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=rental_db;encrypt=true;trustServerCertificate=true
    username: sa
    password: YourPassword123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.rental: DEBUG
    org.springframework.security: DEBUG

app:
  jwt:
    secret: RentHubSecureSecretKeyForJWTAuthHS256BitAlgorithmNeedAtLeast32Bytes2026!
    expiration: 900000            # 15 phút (15 * 60 * 1000 ms)
    refresh-expiration: 604800000   # 7 ngày (7 * 24 * 60 * 60 * 1000 ms)
