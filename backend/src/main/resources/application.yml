server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=rental_db;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:YourPassword123}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.rentalshop: INFO
    org.springframework.security: WARN

app:
  jwt:
    secret: ${JWT_SECRET:RentHubSecureSecretKeyForJWTAuthHS256BitAlgorithmNeedAtLeast32Bytes2026!}
    expiration: ${JWT_EXPIRATION:900000}            # 15 phút (15 * 60 * 1000 ms)
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}   # 7 ngày (7 * 24 * 60 * 60 * 1000 ms)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
